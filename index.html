<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine? 💘</title>

<style>
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Comic Sans MS', cursive;
    text-align: center;
    height: 100vh;
    overflow: hidden;
}

.container {
    margin-top: 50px;
}

h1 {
    font-size: 3em;
    color: #fff;
    text-shadow: 2px 2px 5px #ff4d6d;
}

img {
    width: 300px;
    border-radius: 20px;
    margin: 20px 0;
}

.buttons {
    margin-top: 30px;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
}

#yes {
    background-color: #ff4d6d;
    color: white;
}

#no {
    background-color: #444;
    color: white;
    position: absolute;
}
</style>
</head>

<body>

<div class="container">
    <h1>Will you be my Valentine? lil miss beautiful Kriyashil 💖</h1>

    <!-- Replace the image link with your favorite Dudu & Bubu image -->
    <img src="shakespaw.gif" alt="Dudu and Bubu">

    <div class="buttons">
        <button id="yes" onclick="yesClicked()">YES 💘</button>
        <button id="no" onmouseover="moveNo()">NO 💔</button>
    </div>
</div>

<script>
function yesClicked() {
    document.body.innerHTML = `
        <div style="margin-top:100px;">
            <h1 style="color:white;">YAAAY!!! 💕🥰</h1>
            <p style="font-size:30px;color:white;">
                You just made my heart very happy 💖

                 <img src="bubu-bubu-dudu.gif" alt="Dudu and Bubu">
            </p>
        </div>
    `;
}

function moveNo() {
    const noBtn = document.getElementById("no");
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}
</script>

</body>
</html>
